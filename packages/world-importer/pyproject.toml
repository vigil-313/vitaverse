[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-importer"
version = "0.1.0"
description = "OpenStreetMap to Vitaverse world data importer"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Vitaverse Team"}
]
dependencies = [
    "overpy>=0.7",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
]

[project.scripts]
world-importer = "world_importer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["world_importer*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
